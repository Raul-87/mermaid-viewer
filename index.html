<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mermaid Viewer</title>
    <style>
        body { margin: 0; padding: 10px; font-family: sans-serif; background-color: #f9f9f9; }
        /* 初期状態で全体を中央に収める */
        #graphDiv { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 90vh; 
            width: 100%;
        }
        /* 画面幅を超えないように設定 */
        #graphDiv svg {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div id="graphDiv">
        <p style="color: gray;">処理中...</p>
    </div>

    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

        // 1. カラーパレットと矢印のスタイル初期化
        mermaid.initialize({
            startOnLoad: false,
            theme: 'base',
            themeVariables: {
                primaryColor: '#F28EA7',       // Pink
                secondaryColor: '#FAE09E',     // Yellow
                tertiaryColor: '#CDBF9F',      // Beige
                primaryBorderColor: '#4FDBB2', // Teal
                lineColor: '#76BEE0',          // Blue
                textColor: '#333333'
            },
            flowchart: { 
                useMaxWidth: false,
                // ▼ 矢印を曲線ではなく直角に曲がる直線（ポリライン）に統一 ▼
                curve: 'stepAfter' 
            },
            gantt: { useMaxWidth: false, fontSize: 14 }
        });

        // 2. UTF-8対応の安全なBase64デコード関数
        function decodeBase64UTF8(base64) {
            try {
                // URLパラメータで半角スペースに変換されてしまった '+' を復元
                const safeBase64 = base64.replace(/ /g, '+');
                const binString = window.atob(safeBase64);
                const bytes = new Uint8Array(binString.length);
                for (let i = 0; i < binString.length; i++) {
                    bytes[i] = binString.charCodeAt(i);
                }
                return new TextDecoder('utf-8').decode(bytes);
            } catch (e) {
                console.error("Base64 Decode Error:", e);
                return null;
            }
        }

        // 3. サニタイズ関数（iOSスマート句読点の無害化）
        function sanitizeMermaidCode(code) {
            if (!code) return '';
            let s = code;
            s = s.replace(/[\u200B-\u200D\uFEFF]/g, ''); // ゼロ幅文字除去
            s = s.replace(/[\u2018\u2019]/g, "'");       // シングルクォート
            s = s.replace(/[\u201C\u201D]/g, '"');       // ダブルクォート
            s = s.replace(/\u2014/g, '--');              // エムダッシュ -> ハイフン
            s = s.replace(/\u2013/g, '-');               // エンダッシュ -> ハイフン
            s = s.replace(/\u2212/g, '-');               // マイナス記号 -> ハイフン
            s = s.replace(/(\r\n|\r|[\u2028\u2029])/g, '\n');
            s = s.replace(/[\u3000\u00A0]/g, ' ');       // 全角スペース -> 半角スペース
            s = s.replace(/^[ \t]*%%.*$/gm, '');         // コメント行の削除
            s = s.replace(/\n{2,}/g, '\n');
            return s.trim();
        }

        // 4. レンダリング処理
        async function renderGraph() {
            const container = document.getElementById('graphDiv');
            const urlParams = new URLSearchParams(window.location.search);
            const b64Code = urlParams.get('b64');
            let rawCode = b64Code ? decodeBase64UTF8(b64Code) : urlParams.get('code');

            if (!rawCode) {
                container.innerHTML = '<p style="color: gray;">コードが入力されていません。</p>';
                return;
            }

            try {
                const cleanCode = sanitizeMermaidCode(rawCode);
                const { svg } = await mermaid.render('mermaid-svg', cleanCode);
                container.innerHTML = svg;
            } catch (error) {
                console.error("Mermaid Render Error:", error);
                const safeErrorMsg = error.message.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                container.innerHTML = `<pre style="color: #D8000C; background: #FFD2D2; padding: 10px;">Render Error:\n${safeErrorMsg}</pre>`;
            }
        }

        renderGraph();
    </script>
</body>
</html>
