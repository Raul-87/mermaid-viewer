<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mermaid Viewer</title>
    <style>
        body { 
            margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; 
            background-color: #f8f9fa; background-image: radial-gradient(#ced4da 1px, transparent 1px); background-size: 20px 20px; 
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        }
        #graphDiv { 
            background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); 
            padding: 40px; border-radius: 24px; border: 1px solid #f1f3f5; box-shadow: 0 12px 48px rgba(0, 0, 0, 0.06); 
            max-width: 100%; overflow: auto; display: flex; justify-content: center;
        }
        .error-msg { color: #ff3b30; font-size: 14px; font-weight: 500; word-break: break-all; }
        .empty-msg { color: #868e96; font-size: 15px; font-weight: 500; letter-spacing: 0.5px;}
    </style>
</head>
<body>
    <div id="graphDiv">
        <svg id="spinner" width="40" height="40" viewBox="0 0 50 50">
            <path fill="#adb5bd" d="M25,5A20.14,20.14,0,0,1,45,22.88V25A20,20,0,1,1,5,25V22.88A20.14,20.14,0,0,1,25,5m0-5A25,25,0,1,0,50,25,25,25,0,0,0,25,0Z">
                <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s" repeatCount="indefinite"/>
            </path>
        </svg>
    </div>

    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

        const container = document.getElementById('graphDiv');

        (async () => {
            try {
                mermaid.initialize({ 
                    startOnLoad: false, 
                    theme: 'base',
                    themeVariables: {
                        primaryColor: '#ffffff', primaryTextColor: '#343a40', primaryBorderColor: '#dee2e6', lineColor: '#adb5bd', 
                        secondaryColor: '#f8f9fa', tertiaryColor: '#f1f3f5', clusterBkg: '#f8f9fa', clusterBorder: '#e9ecef', 
                        fontFamily: '-apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif',
                    },
                    flowchart: { curve: 'basis', nodeSpacing: 70, rankSpacing: 70, padding: 24 },
                    gantt: { 
                        // ガントチャート特有のデザイン調整（見やすさ向上）
                        titleTopMargin: 25, barHeight: 25, barGap: 4, topPadding: 50, leftPadding: 75,
                        gridLineStartPadding: 35, fontSize: 13, sectionFontSize: 14, numberSectionStyles: 4
                    },
                    securityLevel: 'loose',
                });

                const urlParams = new URLSearchParams(window.location.search);
                const rawCode = urlParams.get('code');

                if (!rawCode) {
                    container.innerHTML = '<div class="empty-msg">Mermaidコードをコピーして背面タップしてください</div>';
                    return;
                }

                // 【改修ポイント】全角スペースやNBSP（特殊スペース）をすべて標準の半角スペースに置換して無害化
                const sanitizedCode = rawCode.replace(/[\u00A0\u3000]/g, ' ');

                const uniqueId = 'mermaid-' + Date.now();
                const { svg } = await mermaid.render(uniqueId, sanitizedCode);
                
                container.innerHTML = svg;

            } catch (error) {
                container.innerHTML = `<div class="error-msg">レンダリングエラー:<br>${error.message}</div>`;
            }
        })();
    </script>
</body>
</html>
