<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mermaid Viewer</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background-color: #f9f9f9; }
        
        /* 修正ポイント1: 無理な中央寄せをやめ、スクロール可能な領域にする */
        #graphDiv { 
            width: 100vw; 
            height: 100vh; 
            overflow: auto; /* 指で上下左右にスクロール可能にする */
            padding: 20px; 
            box-sizing: border-box;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
        }
        
        /* 修正ポイント2: SVGがスマホの画面幅に合わせて勝手に極小に縮むのを防ぐ */
        #graphDiv svg {
            min-width: 800px; /* 最低でもこの幅を保ち、文字の潰れを防ぐ */
            height: auto;
        }
    </style>
</head>
<body>
    <div id="graphDiv">
        <p style="color: gray;">処理中...</p>
    </div>

    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

        mermaid.initialize({
            startOnLoad: false,
            theme: 'base',
            themeVariables: {
                primaryColor: '#F28EA7',
                secondaryColor: '#FAE09E',
                tertiaryColor: '#CDBF9F',
                primaryBorderColor: '#4FDBB2',
                lineColor: '#76BEE0',
                textColor: '#333333',
                fontSize: '16px' /* ベースの文字サイズを少し大きく固定 */
            },
            /* 修正ポイント3: Mermaid側で勝手に最大幅に縮小する機能をオフにする */
            flowchart: { useMaxWidth: false },
            gantt: { useMaxWidth: false, fontSize: 14 }
        });

        function decodeBase64UTF8(base64) {
            try {
                const safeBase64 = base64.replace(/ /g, '+');
                const binString = window.atob(safeBase64);
                const bytes = new Uint8Array(binString.length);
                for (let i = 0; i < binString.length; i++) {
                    bytes[i] = binString.charCodeAt(i);
                }
                return new TextDecoder('utf-8').decode(bytes);
            } catch (e) {
                console.error("Base64 Decode Error:", e);
                return null;
            }
        }

        function sanitizeMermaidCode(code) {
            if (!code) return '';
            let s = code;
            s = s.replace(/[\u200B-\u200D\uFEFF]/g, '');
            s = s.replace(/[\u2018\u2019]/g, "'");
            s = s.replace(/[\u201C\u201D]/g, '"');
            s = s.replace(/\u2014/g, '--');
            s = s.replace(/\u2013/g, '-');
            s = s.replace(/\u2212/g, '-');
            s = s.replace(/(\r\n|\r|[\u2028\u2029])/g, '\n');
            s = s.replace(/[\u3000\u00A0]/g, ' ');
            s = s.replace(/^[ \t]*%%.*$/gm, '');
            s = s.replace(/\n{2,}/g, '\n');
            return s.trim();
        }

        async function renderGraph() {
            const container = document.getElementById('graphDiv');
            const urlParams = new URLSearchParams(window.location.search);
            const b64Code = urlParams.get('b64');
            let rawCode = b64Code ? decodeBase64UTF8(b64Code) : urlParams.get('code');

            if (!rawCode) {
                container.innerHTML = '<p style="color: gray;">コードが入力されていません。</p>';
                return;
            }

            try {
                const cleanCode = sanitizeMermaidCode(rawCode);
                const { svg } = await mermaid.render('mermaid-svg', cleanCode);
                container.innerHTML = svg;
            } catch (error) {
                const safeErrorMsg = error.message.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                container.innerHTML = `<pre style="color: #D8000C; background: #FFD2D2; padding: 10px;">Render Error:\n${safeErrorMsg}</pre>`;
            }
        }

        renderGraph();
    </script>
</body>
</html>
