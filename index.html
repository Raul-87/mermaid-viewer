<script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

        const container = document.getElementById('graphDiv');

        // 特殊文字を安全に画面表示するための関数
        const escapeHTML = (str) => {
            if (!str) return "";
            return str.replace(/[&<>'"]/g, match => {
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' };
                return map[match];
            });
        };

        (async () => {
            let sanitizedCode = ""; 
            try {
                mermaid.initialize({ 
                    startOnLoad: false, 
                    theme: 'base',
                    themeVariables: {
                        primaryColor: '#CDBF9F', primaryTextColor: '#343a40', primaryBorderColor: '#b0a48a', lineColor: '#76BEE0', 
                        secondaryColor: '#FAE09E', tertiaryColor: '#F28EA7',
                        fontFamily: '-apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif',
                    },
                    flowchart: { curve: 'basis', nodeSpacing: 70, rankSpacing: 70, padding: 24 },
                    gantt: { titleTopMargin: 25, barHeight: 25, barGap: 4, topPadding: 50, leftPadding: 75, fontSize: 13, sectionFontSize: 14 },
                    securityLevel: 'loose',
                });

                const urlParams = new URLSearchParams(window.location.search);
                let rawCode = urlParams.get('code');

                if (!rawCode) {
                    container.innerHTML = '<div class="empty-msg">Mermaidコードをコピーして背面タップしてください</div>';
                    return;
                }

                try { rawCode = decodeURIComponent(rawCode); } catch (e) {}

                // ★ 文字化け・構文エラーを起こさない安全なサニタイズ ★
                sanitizedCode = rawCode
                    // 1. iOSのスマート句読点をUnicodeで指定して置換（文字化け回避）
                    .replace(/[\u2013\u2014]/g, '-') // ダッシュ
                    .replace(/[\u201C\u201D]/g, '"') // ダブルクォート
                    .replace(/[\u2018\u2019]/g, "'") // シングルクォート
                    // 2. iOSの特殊改行を統一
                    .replace(/\r\n|\r|\u2028|\u2029/g, '\n')
                    // 3. 全角スペースやNBSPを半角に
                    .replace(/[\u00A0\u3000]/g, ' ')
                    // 4. ゼロ幅文字やBOMを完全排除
                    .replace(/[\u200B-\u200D\uFEFF]/g, '')
                    .split('\n')
                    .map(line => line.trimEnd())
                    // 5. コメント行(%%)を削除（ただし%%{...}%%のような設定ディレクティブは保護）
                    .filter(line => {
                        const t = line.trim();
                        return !(t.startsWith('%%') && !t.startsWith('%%{'));
                    })
                    // 6. 空行を削除して詰める
                    .filter(line => line.trim().length > 0)
                    .join('\n');

                if (!sanitizedCode) {
                    throw new Error("コードが空です（読み込み後に有効なテキストがありません）");
                }

                const uniqueId = 'mermaid-' + Date.now();
                const { svg } = await mermaid.render(uniqueId, sanitizedCode);
                
                container.innerHTML = svg;

            } catch (error) {
                // エラー内容に < や > が含まれていても画面が壊れないようにエスケープして表示
                container.innerHTML = `
                    <div class="error-msg">レンダリングエラー:<br>${escapeHTML(error.message || String(error))}</div>
                    <div class="debug-log">【デバッグログ: 変換後のコード】\n${escapeHTML(sanitizedCode)}</div>
                `;
            }
        })();
    </script>
