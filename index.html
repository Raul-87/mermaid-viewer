<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mermaid Viewer</title>
    <style>
        body { 
            margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; 
            background-color: #f8f9fa; background-image: radial-gradient(#ced4da 1px, transparent 1px); background-size: 20px 20px; 
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        }
        #graphDiv { 
            background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); 
            padding: 40px; border-radius: 24px; border: 1px solid #f1f3f5; box-shadow: 0 12px 48px rgba(0, 0, 0, 0.06); 
            max-width: 100%; overflow: auto; display: flex; justify-content: center;
        }
        .error-msg { color: #ff3b30; font-size: 14px; font-weight: 500; word-break: break-all; }
        .empty-msg { color: #868e96; font-size: 15px; font-weight: 500; letter-spacing: 0.5px;}
    </style>
</head>
<body>
    <div id="graphDiv">
        <svg id="spinner" width="40" height="40" viewBox="0 0 50 50">
            <path fill="#adb5bd" d="M25,5A20.14,20.14,0,0,1,45,22.88V25A20,20,0,1,1,5,25V22.88A20.14,20.14,0,0,1,25,5m0-5A25,25,0,1,0,50,25,25,25,0,0,0,25,0Z">
                <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s" repeatCount="indefinite"/>
            </path>
        </svg>
    </div>

    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

        const container = document.getElementById('graphDiv');

        (async () => {
            try {
                // Mermaidの初期化設定（指定のカラーパレットを適用）
                mermaid.initialize({ 
                    startOnLoad: false, 
                    theme: 'base',
                    themeVariables: {
                        // --- 共通の基本カラー設定 ---
                        primaryColor: '#CDBF9F',       // Beige
                        primaryTextColor: '#343a40', 
                        primaryBorderColor: '#b0a48a', // Beigeのボーダー用
                        lineColor: '#76BEE0',          // Blue (線や矢印)
                        secondaryColor: '#FAE09E',     // Yellow
                        tertiaryColor: '#F28EA7',      // Pink
                        clusterBkg: '#f8f9fa', 
                        clusterBorder: '#e9ecef', 
                        fontFamily: '-apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif',
                        
                        // --- ガントチャート専用のカラー設定 ---
                        taskBkgColor: '#76BEE0',       // 通常タスク (Blue)
                        taskBorderColor: '#67a6c4',
                        taskTextColor: '#ffffff',
                        activeTaskBkgColor: '#FAE09E', // 進行中タスク [active] (Yellow)
                        activeTaskBorderColor: '#dbc58a',
                        doneTaskBkgColor: '#CDBF9F',   // 完了タスク [done] (Beige)
                        doneTaskBorderColor: '#b0a48a',
                        critBkgColor: '#F28EA7',       // 重要タスク [crit] (Pink)
                        critBorderColor: '#d17a8f',
                        todayLineColor: '#F28EA7',     // 現在日時の線 (Pink)
                    },
                    flowchart: { curve: 'basis', nodeSpacing: 70, rankSpacing: 70, padding: 24 },
                    gantt: { 
                        titleTopMargin: 25, barHeight: 25, barGap: 4, topPadding: 50, leftPadding: 75,
                        gridLineStartPadding: 35, fontSize: 13, sectionFontSize: 14, numberSectionStyles: 4
                    },
                    securityLevel: 'loose',
                });

                const urlParams = new URLSearchParams(window.location.search);
                let rawCode = urlParams.get('code');

                if (!rawCode) {
                    container.innerHTML = '<div class="empty-msg">Mermaidコードをコピーして背面タップしてください</div>';
                    return;
                }

                // URLエンコードの不整合対策（明示的デコード）
                try {
                    rawCode = decodeURIComponent(rawCode);
                } catch (e) {
                    console.warn('URLデコードに失敗しました。生の文字列をそのまま使用します。', e);
                }

                // 強力なサニタイズ処理
                const sanitizedCode = rawCode
                    .replace(/\r\n|\r/g, '\n')           // 1. 改行コードを \n に統一 (iOS対策)
                    .replace(/[\u00A0\u3000]/g, ' ')     // 2. NBSPや全角スペースを半角スペースに
                    .replace(/[\u200B-\u200D\uFEFF]/g, '') // 3. ゼロ幅スペースやBOMを削除
                    .split('\n')
                    .map(line => line.trimEnd())         // 4. 行末の不要なスペースを削除
                    .filter(line => line.trim().length > 0) // 5. 空行を削除（パースエラー防止）
                    .join('\n');

                // デバッグ用出力 (SafariのWebインスペクタで確認可能)
                console.log('--- Sanitized Mermaid Code ---');
                console.log(sanitizedCode);

                // レンダリング実行
                const uniqueId = 'mermaid-' + Date.now();
                const { svg } = await mermaid.render(uniqueId, sanitizedCode);
                
                container.innerHTML = svg;

            } catch (error) {
                // エラー内容を画面に表示
                container.innerHTML = `<div class="error-msg">レンダリングエラー:<br>${error.message}</div>`;
                console.error("Mermaid Render Error:", error);
            }
        })();
    </script>
</body>
</html>
