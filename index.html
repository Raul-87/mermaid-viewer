<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mermaid Viewer</title>
    <style>
        body { 
            margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; background-color: #f2f2f7; font-family: -apple-system, sans-serif;
        }
        #graphDiv { 
            background-color: #ffffff; padding: 24px; border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); max-width: 100%; overflow: auto; 
            display: flex; justify-content: center;
        }
        .error-msg { color: #ff3b30; font-size: 14px; font-weight: 500; word-break: break-all; }
        .empty-msg { color: #8e8e93; font-size: 15px; font-weight: 500; }
    </style>
</head>
<body>
    <div id="graphDiv">
        <svg id="spinner" width="40" height="40" viewBox="0 0 50 50">
            <path fill="#c7c7cc" d="M25,5A20.14,20.14,0,0,1,45,22.88V25A20,20,0,1,1,5,25V22.88A20.14,20.14,0,0,1,25,5m0-5A25,25,0,1,0,50,25,25,25,0,0,0,25,0Z">
                <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s" repeatCount="indefinite"/>
            </path>
        </svg>
    </div>

    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

        const container = document.getElementById('graphDiv');

        (async () => {
            try {
                mermaid.initialize({ 
                    startOnLoad: false, 
                    theme: 'neutral',
                    fontFamily: '-apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", sans-serif',
                    securityLevel: 'loose',
                });

                const urlParams = new URLSearchParams(window.location.search);
                
                // 【修正点】URLSearchParamsは自動でデコード済みのテキストを返すため、そのまま使用します
                const mermaidCode = urlParams.get('code');

                if (!mermaidCode) {
                    container.innerHTML = '<div class="empty-msg">Mermaidコードをコピーして背面タップしてください</div>';
                    return;
                }

                const uniqueId = 'mermaid-' + Date.now();
                const { svg } = await mermaid.render(uniqueId, mermaidCode);
                
                container.innerHTML = svg;

            } catch (error) {
                container.innerHTML = `<div class="error-msg">レンダリングエラー:<br>${error.message}</div>`;
            }
        })();
    </script>
</body>
</html>
